# Plan 49 T4: a first run on a real Android app, as a person would use it.
# Selectors are the labels screen readers use (accessibilityLabel / visible text).
# No hideKeyboard: on the test emulator image there's no on-screen keyboard and it
# presses Back, which closes the app. Buttons are scrolled to instead.
appId: app.travelog.mobile
name: First run, plan a trip, add a stop, a booking and an expense
---
- launchApp:
    clearState: true
    # Allow notifications and the rest up front, so no system prompt covers the app.
    permissions:
      all: allow
# A slow emulator can show "… isn't responding" over the app; let it wait.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: 'Wait'
# Welcome. A first launch sets up the encrypted database, so allow it time.
- extendedWaitUntil:
    visible: 'Plan trips with your friends'
    timeout: 60000
- takeScreenshot: welcome
# The name field is focused on open; its placeholder identifies it.
- tapOn: 'What friends call you'
- inputText: 'Asha'
- scrollUntilVisible:
    element: "Let's go"
- tapOn: "Let's go"
# New trip
- tapOn: 'Plan a trip'
- tapOn: 'Trip name'
- inputText: 'Goa test'
- scrollUntilVisible:
    element: 'Create trip'
- tapOn: 'Create trip'
# Itinerary: the skeleton gives way to the plan (Plan 46)
- extendedWaitUntil:
    visible: 'Collect ideas here'
    timeout: 15000
# An empty day offers "Add the first stop".
- scrollUntilVisible:
    element: 'Add the first stop'
- tapOn: 'Add the first stop'
- tapOn: 'Name'
- inputText: 'Chapora Fort'
- scrollUntilVisible:
    element:
      text: 'Add'
      index: 0
- tapOn:
    text: 'Add'
    index: 0
- scrollUntilVisible:
    element: 'Chapora Fort'
- takeScreenshot: itinerary
# Bookings: enter one by hand
- tapOn: 'Bookings'
- tapOn: 'Add booking'
- tapOn: 'Enter booking details'
- tapOn: 'Name'
- inputText: 'Panjim stay'
- scrollUntilVisible:
    element:
      text: 'Add booking'
      index: 1
- tapOn:
    text: 'Add booking'
    index: 1
- scrollUntilVisible:
    element: 'Panjim stay'
- takeScreenshot: bookings
# Budget: add an expense; the spending chart shows it (Plans 47-48)
- tapOn: 'Budget'
- tapOn: 'Add expense'
- tapOn: 'What for'
- inputText: 'Fish thali'
- tapOn: 'Amount (INR)'
- inputText: '450'
- scrollUntilVisible:
    element: 'Save expense'
- tapOn: 'Save expense'
- scrollUntilVisible:
    element: 'spent'
- scrollUntilVisible:
    element: 'Fish thali'
- takeScreenshot: budget
