# Plan 49 T4: a first run on a real Android app, as a person would use it.
# Selectors are the labels screen readers use (accessibilityLabel / visible text).
# No hideKeyboard: on the test emulator image there's no on-screen keyboard and it
# presses Back, which closes the app. Buttons are scrolled to instead.
appId: app.travelog.mobile
name: First run, see the globe, create a trip on it, add a stop, a booking and an expense
---
- launchApp:
    clearState: true
    # Allow notifications and the rest up front, so no system prompt covers the app.
    permissions:
      all: allow
# A slow emulator can show "… isn't responding" over the app; let it wait.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: 'Wait'
# Welcome. A first launch sets up the encrypted database, so allow it time.
- extendedWaitUntil:
    visible: 'Plan trips with your friends'
    timeout: 60000
- takeScreenshot: welcome
# The name field is focused on open; its placeholder identifies it.
- tapOn: 'What friends call you'
- inputText: 'Asha'
- scrollUntilVisible:
    element: "Let's go"
- tapOn: "Let's go"
# Trips: the globe is really on screen (Plans 66, 71). Unit tests use a stand-in for the web
# view, so this is the one check that the globe loads in a built app.
- extendedWaitUntil:
    visible: 'Globe'
    timeout: 30000
- takeScreenshot: globe-home
# The tab bar is really there and answers (Plan 76: the globe's drawer once covered it). A tap
# on a covered bar lands on the drawer, so the next screen never shows.
- tapOn: 'Profile'
- extendedWaitUntil:
    visible: 'Countries you’ve visited.*'
    timeout: 15000
# Profile also shows the word "Trips" (its trip count), so go back by way of Explore.
- tapOn: 'Explore'
- assertVisible: 'Search a country'
- tapOn: 'Trips'
- assertVisible: 'Your trips'
# Create a trip on the globe, by search (Plan 67)
- tapOn: 'Create a trip'
- assertVisible: 'Where to?'
- tapOn: 'Search a country or city'
- inputText: 'Panaji'
- tapOn: 'Add Panaji, India'
- tapOn: 'Let.s go.*'
# Next month, the 15th to the 17th: three days, always in the future.
- tapOn: 'Next month'
- tapOn: '15 [A-Z][a-z]+ 20[0-9]{2}'
- tapOn: '17 [A-Z][a-z]+ 20[0-9]{2}'
- tapOn: 'Next →'
- assertVisible: 'Pick your stops'
- tapOn: 'Next →'
- assertVisible: 'Panaji trip'
- tapOn: 'One day more in Panaji'
- tapOn: 'One day more in Panaji'
- assertVisible: 'All days placed'
- takeScreenshot: create-trip-days
- tapOn: 'Create trip'
# Itinerary: the skeleton gives way to the plan (Plan 46)
- extendedWaitUntil:
    visible:
      id: 'day-strip'
    timeout: 15000
# The trip has dates now, so it opens on its first day. The empty day's 3D art (Plan 52)
# puts its text further down: scroll to it.
- scrollUntilVisible:
    element: 'Nothing planned for this day'
# An empty day offers "Add the first stop".
- scrollUntilVisible:
    element: 'Add the first stop'
- tapOn: 'Add the first stop'
- tapOn: 'Name'
- inputText: 'Chapora Fort'
# Plan 57: a place as typed (no server in e2e, so no map spot).
- tapOn: 'Place'
- inputText: 'Vagator'
- tapOn: 'Use "Vagator" as typed'
- scrollUntilVisible:
    element:
      text: 'Add'
      index: 0
- tapOn:
    text: 'Add'
    index: 0
- scrollUntilVisible:
    element: 'Chapora Fort'
- assertVisible: 'At Vagator'
- takeScreenshot: itinerary
# Bookings: enter one by hand
- tapOn: 'Bookings'
- tapOn: 'Add booking'
- tapOn: 'Enter booking details'
- tapOn: 'Name'
- inputText: 'Panjim stay'
- scrollUntilVisible:
    element:
      text: 'Add booking'
      index: 1
- tapOn:
    text: 'Add booking'
    index: 1
- scrollUntilVisible:
    element: 'Panjim stay'
- takeScreenshot: bookings
# Budget: add an expense; the spending chart shows it (Plans 47-48)
- tapOn: 'Budget'
- tapOn: 'Add expense'
- tapOn: 'What for'
- inputText: 'Fish thali'
- tapOn: 'Amount (INR)'
- inputText: '450'
- scrollUntilVisible:
    element: 'Save expense'
- tapOn: 'Save expense'
- scrollUntilVisible:
    element: 'spent'
- scrollUntilVisible:
    element: 'Fish thali'
- takeScreenshot: budget
# Back out of the trip to the tabs (Android Back; the trip is one screen above them).
- back
# Profile on the globe (Plan 74): the visited section, and Settings behind the gear.
- tapOn: 'Profile'
- extendedWaitUntil:
    visible: 'Countries you’ve visited.*'
    timeout: 15000
- assertVisible: '0 countries visited'
- takeScreenshot: profile
- tapOn: 'Settings'
- assertVisible: 'About'
- takeScreenshot: settings
- tapOn: 'Back to Profile'
# Explore on the globe (Plan 73): with no country it offers a country search.
- tapOn: 'Explore'
- assertVisible: 'Search a country'
- takeScreenshot: explore
