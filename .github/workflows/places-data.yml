name: Places data

# Plan 29. Rebuilds the phone's basic places list from GeoNames (CC-BY 4.0) plus
# data/places/overrides.json, checks it, and commits it to the branch it ran on.
# Optionally loads the full list (towns over 500 people) into Supabase.
# Run it before each release: Actions → Places data → Run workflow.
on:
  workflow_dispatch:
    inputs:
      seed_server:
        description: Also load the full list into Supabase (needs the STAGING_DB_URL secret)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test the pipeline
        run: node --test scripts/places/lib.test.mjs
      - name: Build and check the phone's basic list
        run: node scripts/places/build.mjs
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- apps/mobile/assets/places/basic.places; then
            echo "::notice::Places list unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/assets/places/basic.places
          git commit -m "chore(places): rebuild the phone's basic places list from GeoNames"
          git push

  server:
    if: inputs.seed_server
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the STAGING_DB_URL repository secret (docs/14-owner-setup.md §4)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Load the full places list into Supabase
        run: node scripts/places/seed-server.mjs
