name: E2E (Android emulator)

# Plan 49 T4: builds a release APK (with the same tree shaking as preview and
# production builds, T3), runs it on an Android emulator and drives it with the
# Maestro flows in apps/mobile/e2e. About 25 minutes, so not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
  push:
    paths:
      - 'apps/mobile/e2e/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Release build on an emulator (tree shaking ${{ matrix.shake || 'off' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Diagnosing a release crash: is it the tree shaking (Plan 49 T3)?
        shake: ['1', '']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      # Only the tree-shaking variant sets these (an empty value isn't read as off).
      - name: Turn on tree shaking
        if: matrix.shake == '1'
        run: |
          echo "EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH=1" >> "$GITHUB_ENV"
          echo "EXPO_UNSTABLE_TREE_SHAKING=1" >> "$GITHUB_ENV"

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK (emulator architecture only)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/e2e --format junit --output e2e-report.xml --test-output-dir e2e-output || (mkdir -p e2e-output && adb logcat -d > e2e-output/logcat.txt; grep -E "ReactNativeJS|AndroidRuntime|FATAL|ReactNative" e2e-output/logcat.txt | tail -120; exit 1)

      - name: Keep screenshots and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-shake-${{ matrix.shake || 'off' }}
          path: |
            e2e-report.xml
            e2e-output
            ~/.maestro/tests
          if-no-files-found: ignore
