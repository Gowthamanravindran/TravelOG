name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**', 'phase-*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  app:
    name: Lint, typecheck, test, bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Export Android bundle
        run: pnpm --filter @travelog/mobile export:android
      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs

  database:
    name: Database migrations and permission tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres and apply migrations + seed
        run: supabase db start
      - name: Run pgTAP tests
        run: supabase test db
